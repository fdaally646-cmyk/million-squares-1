<!-- أضف هذا قبل </body> في index.html -->
<div id="paymentModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;justify-content:center;align-items:center;">
    <div style="background:#1a1a2e;padding:35px;border-radius:20px;max-width:500px;width:92%;border:1px solid #2a2a4a;position:relative;">
        <button onclick="document.getElementById('paymentModal').style.display='none'" style="position:absolute;top:15px;left:20px;font-size:28px;background:none;border:none;color:#aaa;cursor:pointer;">&times;</button>
        <h2 style="color:#ffd700;text-align:center;">💳 اختيار طريقة الدفع</h2>
        <div id="paymentMethods">
            <button onclick="processPayment('paypal')" style="background:#0070ba;color:#fff;padding:18px;border:none;border-radius:12px;font-size:1.1rem;font-weight:700;cursor:pointer;width:100%;margin:8px 0;display:flex;align-items:center;justify-content:center;gap:15px;">
                <i class="fab fa-paypal" style="font-size:2rem;"></i> PayPal
            </button>
            <button onclick="processPayment('stripe')" style="background:#635bff;color:#fff;padding:15px;border:none;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;width:100%;margin:8px 0;">💳 Stripe</button>
            <button onclick="processPayment('crypto')" style="background:#f7931a;color:#fff;padding:15px;border:none;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;width:100%;margin:8px 0;">₿ USDT</button>
        </div>
        <div id="paymentDetails" style="display:none;margin-top:15px;padding:20px;background:rgba(255,255,255,0.05);border-radius:12px;"></div>
    </div>
</div>
<button onclick="document.getElementById('paymentModal').style.display='flex'" style="position:fixed;bottom:100px;right:30px;z-index:998;background:linear-gradient(135deg,#ffd700,#ff6b00);color:#000;padding:15px 25px;border:none;border-radius:50px;font-weight:bold;cursor:pointer;box-shadow:0 5px 25px rgba(255,215,0,0.3);display:flex;align-items:center;gap:10px;">
    <i class="fas fa-shopping-cart"></i> شراء بكسل
</button>
<script>
function processPayment(method) {
    alert('✅ جاري الدفع عبر ' + method + '... (تجريبي)');
    document.getElementById('paymentModal').style.display = 'none';
}
</script>
