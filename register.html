<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - مليون مربع</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }
        .container {
            background: #1a1a2e;
            border-radius: 24px;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            border: 1px solid #2a2a4a;
            box-shadow: 0 25px 80px rgba(0,0,0,0.6);
        }
        .logo { text-align: center; font-size: 3.5rem; margin-bottom: 5px; }
        h2 { text-align: center; color: #ffd700; margin-bottom: 25px; font-size: 1.8rem; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; color: #aaa; font-size: 0.85rem; margin-bottom: 5px; }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid #2a2a4a;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .form-group input:focus { outline: none; border-color: #ffd700; }
        .form-group input::placeholder { color: #555; }
        
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ffd700, #ff6b00);
            border: none;
            border-radius: 12px;
            color: #000;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary:hover { transform: scale(1.02); box-shadow: 0 5px 25px rgba(255,215,0,0.3); }
        
        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 25px 0 20px;
            color: #444;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #2a2a4a;
        }
        
        /* ===== أزرار الدفع ===== */
        .pay-btn {
            width: 100%;
            padding: 16px 20px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 10px;
            color: #fff;
        }
        .pay-btn:hover { transform: scale(1.02); }
        .pay-btn.paypal { background: #0070ba; }
        .pay-btn.stripe { background: #635bff; }
        .pay-btn.crypto { background: #f7931a; }
        .pay-btn .icon { font-size: 1.6rem; }
        .pay-btn .label { flex: 1; text-align: center; }
        .pay-btn .badge {
            font-size: 0.6rem;
            background: rgba(255,255,255,0.2);
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 400;
        }
        
        .payment-note {
            text-align: center;
            color: #666;
            font-size: 0.75rem;
            margin-top: 10px;
        }
        .payment-note .highlight { color: #ffd700; }
        
        .auth-footer {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 0.9rem;
        }
        .auth-footer a { color: #ffd700; text-decoration: none; }
        .auth-footer a:hover { text-decoration: underline; }
        
        /* ===== نافذة الدفع ===== */
        .popup {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .popup.active { display: flex; }
        .popup-box {
            background: #1a1a2e;
            padding: 35px;
            border-radius: 24px;
            max-width: 420px;
            width: 92%;
            border: 1px solid #2a2a4a;
            position: relative;
        }
        .popup-close {
            position: absolute;
            top: 12px;
            left: 18px;
            font-size: 24px;
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
        }
        .popup-close:hover { color: #fff; }
        .popup h3 {
            color: #ffd700;
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.4rem;
        }
        .popup .price {
            font-size: 1.8rem;
            color: #ffd700;
            font-weight: 800;
        }
        .popup .sub-desc {
            color: #666;
            font-size: 0.85rem;
            margin: 5px 0 15px;
        }
        .popup .btn-confirm {
            background: #4CAF50;
            color: #fff;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .popup .btn-confirm:hover { background: #45a049; }
        .popup .btn-cancel {
            background: transparent;
            color: #666;
            border: 1px solid #2a2a4a;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            transition: all 0.3s;
        }
        .popup .btn-cancel:hover { background: rgba(255,255,255,0.05); }
        
        .payment-method-detail {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin: 10px 0;
            border: 1px solid #2a2a4a;
        }
        .payment-method-detail .method-icon { font-size: 2.5rem; display: block; margin-bottom: 5px; }
        .payment-method-detail .method-name { font-weight: 700; color: #fff; }
        .payment-method-detail .method-desc { font-size: 0.8rem; color: #666; }
        
        /* ===== إشعار ===== */
        .toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a2e;
            padding: 14px 28px;
            border-radius: 14px;
            border: 1px solid #2a2a4a;
            z-index: 99999;
            display: none;
            text-align: center;
            min-width: 200px;
            max-width: 90%;
            font-size: 0.95rem;
        }
        .toast.show { display: block; }
        .toast.success { border-color: #4CAF50; color: #4CAF50; }
        .toast.warning { border-color: #ffd700; color: #ffd700; }
        .toast.error { border-color: #f44336; color: #f44336; }
        .toast.info { border-color: #2196F3; color: #2196F3; }
        
        .status-text {
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 0.9rem;
        }
        .status-text.success { background: rgba(76,175,80,0.15); color: #4CAF50; }
        .status-text.error { background: rgba(244,67,54,0.15); color: #f44336; }
        .status-text.pending { background: rgba(255,215,0,0.1); color: #ffd700; }
        
        @media (max-width: 500px) {
            .container { padding: 25px; }
            .popup-box { padding: 25px; }
            .pay-btn { font-size: 0.9rem; padding: 14px; }
        }
    </style>
</head>
<body>

    <!-- ===== نموذج التسجيل ===== -->
    <div class="container">
        <div class="logo">🎯</div>
        <h2>إنشاء حساب جديد</h2>
        <p style="text-align:center;color:#555;font-size:0.85rem;margin-bottom:20px;">
            ⚠️ الدفع مطلوب لإتمام التسجيل
        </p>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>👤 الاسم الكامل</label>
                <input type="text" id="fullName" required placeholder="أحمد محمد">
            </div>
            <div class="form-group">
                <label>🏢 اسم الشركة (اختياري)</label>
                <input type="text" id="companyName" placeholder="شركة مليون مربع">
            </div>
            <div class="form-group">
                <label>📧 البريد الإلكتروني</label>
                <input type="email" id="email" required placeholder="example@email.com">
            </div>
            <div class="form-group">
                <label>🔒 كلمة المرور</label>
                <input type="password" id="password" required placeholder="••••••••" minlength="6">
            </div>
            <div class="form-group">
                <label>✅ تأكيد كلمة المرور</label>
                <input type="password" id="confirmPassword" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primary">
                <i class="fas fa-user-plus"></i> إنشاء حساب
            </button>
        </form>

        <div class="divider">━━━━ أو ━━━━</div>

        <!-- ===== أزرار الدفع ===== -->
        <p style="text-align:center;color:#555;font-size:0.8rem;margin-bottom:12px;">
            💳 سجل وادفع معاً
        </p>
        
        <button class="pay-btn paypal" onclick="openPayment('paypal')">
            <span class="icon">💳</span>
            <span class="label">الدفع عبر PayPal</span>
            <span class="badge">آمن</span>
        </button>
        
        <button class="pay-btn stripe" onclick="openPayment('stripe')">
            <span class="icon">💳</span>
            <span class="label">الدفع عبر Stripe</span>
            <span class="badge">بطاقة</span>
        </button>
        
        <button class="pay-btn crypto" onclick="openPayment('crypto')">
            <span class="icon">₿</span>
            <span class="label">الدفع بـ USDT</span>
            <span class="badge">عملة رقمية</span>
        </button>

        <p class="payment-note">
            <span class="highlight">🔒</span> سيتم إنشاء حسابك فور إتمام الدفع
        </p>

        <div class="auth-footer">
            لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
        </div>
    </div>

    <!-- ===== نافذة الدفع ===== -->
    <div id="paymentPopup" class="popup">
        <div class="popup-box">
            <button class="popup-close" onclick="closePayment()">✕</button>
            <h3 id="popupTitle">💳 تأكيد الدفع</h3>
            
            <div id="paymentMethodDetail" class="payment-method-detail">
                <span class="method-icon" id="methodIcon">💳</span>
                <div class="method-name" id="methodName">PayPal</div>
                <div class="method-desc" id="methodDesc">سيتم إنشاء حسابك فور الدفع</div>
            </div>
            
            <div style="text-align:center;margin:15px 0;">
                <span class="price" id="popupPrice">$5.00 USD</span>
                <p class="sub-desc">(رسوم التسجيل السنوية)</p>
            </div>
            
            <div id="paymentStatus" class="status-text" style="display:none;"></div>
            
            <button class="btn-confirm" onclick="confirmPayment()" id="confirmPayBtn">
                ✅ تأكيد الدفع والتسجيل
            </button>
            
            <button class="btn-cancel" onclick="closePayment()">إلغاء</button>
        </div>
    </div>

    <!-- ===== إشعار ===== -->
    <div id="toast" class="toast">
        <span id="toastMsg"></span>
    </div>

    <!-- ============================================ -->
    <!-- JavaScript المتكامل (بدون أي اعتماد خارجي) -->
    <!-- ============================================ -->
    <script>
        // ============================================
        // البيانات
        // ============================================
        let selectedPaymentMethod = 'paypal';
        let userData = {};
        
        // ============================================
        // دوال الإشعارات
        // ============================================
        function showToast(msg, type = 'info') {
            const t = document.getElementById('toast');
            const m = document.getElementById('toastMsg');
            m.textContent = msg;
            t.className = 'toast show ' + type;
            clearTimeout(window.timer);
            window.timer = setTimeout(() => { t.className = 'toast'; }, 4000);
        }
        
        function showStatus(msg, type = 'pending') {
            const el = document.getElementById('paymentStatus');
            el.textContent = msg;
            el.className = 'status-text ' + type;
            el.style.display = 'block';
        }
        
        function hideStatus() {
            const el = document.getElementById('paymentStatus');
            el.style.display = 'none';
        }
        
        // ============================================
        // دوال نافذة الدفع
        // ============================================
        function openPayment(method) {
            // التحقق من صحة بيانات التسجيل
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (!fullName) {
                showToast('⚠️ يرجى إدخال الاسم الكامل', 'warning');
                document.getElementById('fullName').focus();
                return;
            }
            if (!email || !email.includes('@')) {
                showToast('⚠️ يرجى إدخال بريد إلكتروني صحيح', 'warning');
                document.getElementById('email').focus();
                return;
            }
            if (password.length < 6) {
                showToast('⚠️ كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'warning');
                document.getElementById('password').focus();
                return;
            }
            if (password !== confirmPassword) {
                showToast('⚠️ كلمة المرور وتأكيدها غير متطابقين', 'warning');
                document.getElementById('confirmPassword').focus();
                return;
            }
            
            // حفظ بيانات المستخدم
            userData = {
                fullName: fullName,
                companyName: document.getElementById('companyName').value.trim(),
                email: email,
                password: password
            };
            
            selectedPaymentMethod = method;
            
            // تحديث نافذة الدفع
            const popup = document.getElementById('paymentPopup');
            const title = document.getElementById('popupTitle');
            const methodIcon = document.getElementById('methodIcon');
            const methodName = document.getElementById('methodName');
            const methodDesc = document.getElementById('methodDesc');
            const price = document.getElementById('popupPrice');
            const confirmBtn = document.getElementById('confirmPayBtn');
            
            const methods = {
                paypal: { 
                    title: '💳 الدفع عبر PayPal',
                    icon: '💳',
                    name: 'PayPal',
                    desc: 'سيتم توجيهك إلى PayPal لإتمام الدفع',
                    price: '$5.00 USD',
                    btnText: '💳 الدفع عبر PayPal'
                },
                stripe: { 
                    title: '💳 الدفع عبر Stripe',
                    icon: '💳',
                    name: 'Stripe',
                    desc: 'ادفع بأمان باستخدام بطاقتك الائتمانية',
                    price: '$5.00 USD',
                    btnText: '💳 الدفع عبر Stripe'
                },
                crypto: { 
                    title: '💳 الدفع بـ USDT',
                    icon: '₿',
                    name: 'USDT (TRC20)',
                    desc: 'ادفع باستخدام العملات الرقمية المستقرة',
                    price: '5 USDT',
                    btnText: '₿ الدفع بـ USDT'
                }
            };
            
            const data = methods[method] || methods.paypal;
            title.textContent = data.title;
            methodIcon.textContent = data.icon;
            methodName.textContent = data.name;
            methodDesc.textContent = data.desc;
            price.textContent = data.price;
            confirmBtn.innerHTML = data.btnText;
            
            hideStatus();
            popup.classList.add('active');
        }
        
        function closePayment() {
            document.getElementById('paymentPopup').classList.remove('active');
            hideStatus();
        }
        
        // ============================================
        // تأكيد الدفع
        // ============================================
        function confirmPayment() {
            showStatus('⏳ جاري معالجة الدفع...', 'pending');
            
            // محاكاة عملية الدفع
            setTimeout(() => {
                showStatus('✅ تم الدفع بنجاح!', 'success');
                
                // إتمام التسجيل
                setTimeout(() => {
                    completeRegistration({
                        id: 'pay_' + Date.now(),
                        method: selectedPaymentMethod
                    });
                }, 500);
            }, 1500);
        }
        
        // ============================================
        // إتمام التسجيل بعد الدفع
        // ============================================
        function completeRegistration(paymentDetails) {
            const methodNames = {
                paypal: 'PayPal',
                stripe: 'Stripe',
                crypto: 'USDT'
            };
            const methodName = methodNames[selectedPaymentMethod] || selectedPaymentMethod;
            
            showToast(`✅ تم الدفع بنجاح عبر ${methodName}! 🎉`, 'success');
            closePayment();
            
            // إنشاء الحساب
            const user = {
                id: Date.now(),
                name: userData.fullName,
                email: userData.email,
                company: userData.companyName,
                password: userData.password,
                paymentMethod: methodName,
                paymentId: paymentDetails.id,
                registeredAt: new Date().toISOString(),
                status: 'active'
            };
            
            // حفظ في localStorage
            let users = JSON.parse(localStorage.getItem('million_squares_users') || '[]');
            users.push(user);
            localStorage.setItem('million_squares_users', JSON.stringify(users));
            
            // حفظ جلسة المستخدم
            localStorage.setItem('million_squares_session', JSON.stringify({
                userId: user.id,
                name: user.name,
                email: user.email,
                loggedIn: true
            }));
            
            console.log('✅ مستخدم جديد:', user);
            
            setTimeout(() => {
                showToast('🎉 تم إنشاء حسابك بنجاح! جاري التوجيه...', 'success');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            }, 500);
        }
        
        // ============================================
        // معالج نموذج التسجيل
        // ============================================
        function handleRegister(event) {
            event.preventDefault();
            
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (!fullName) {
                showToast('⚠️ يرجى إدخال الاسم الكامل', 'warning');
                document.getElementById('fullName').focus();
                return;
            }
            if (!email || !email.includes('@')) {
                showToast('⚠️ يرجى إدخال بريد إلكتروني صحيح', 'warning');
                document.getElementById('email').focus();
                return;
            }
            if (password.length < 6) {
                showToast('⚠️ كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'warning');
                document.getElementById('password').focus();
                return;
            }
            if (password !== confirmPassword) {
                showToast('⚠️ كلمة المرور وتأكيدها غير متطابقين', 'warning');
                document.getElementById('confirmPassword').focus();
                return;
            }
            
            // حفظ بيانات المستخدم مؤقتاً
            userData = {
                fullName: fullName,
                companyName: document.getElementById('companyName').value.trim(),
                email: email,
                password: password
            };
            
            showToast('⚠️ الدفع مطلوب لإتمام التسجيل. اختر طريقة الدفع أعلاه.', 'warning');
            document.querySelector('.pay-btn').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        
        // ============================================
        // تهيئة الصفحة
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('✅ صفحة التسجيل جاهزة!');
            console.log('💡 طرق الدفع: PayPal, Stripe, USDT');
            console.log('📌 اضغط على زر الدفع لبدء عملية التسجيل');
            
            // إظهار الأزرار
            document.querySelectorAll('.pay-btn').forEach(btn => {
                btn.style.display = 'flex';
            });
        });
        
        // ============================================
        // دوال عامة
        // ============================================
        window.openPayment = openPayment;
        window.closePayment = closePayment;
        window.confirmPayment = confirmPayment;
        window.handleRegister = handleRegister;
        window.showToast = showToast;
    </script>
</body>
</html>
