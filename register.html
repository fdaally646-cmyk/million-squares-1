<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - مليون مربع</title>
    
    <!-- ======== Font Awesome ======== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- ======== PayPal SDK ======== -->
    <script src="https://www.paypal.com/sdk/js?client-id=sb&currency=USD&components=buttons&enable-funding=venmo"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }
        .container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            max-width: 520px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 25px 80px rgba(0,0,0,0.6);
        }
        .logo { text-align: center; font-size: 3.5rem; margin-bottom: 5px; }
        h2 { text-align: center; color: #ffd700; margin-bottom: 25px; font-size: 1.8rem; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; color: rgba(255,255,255,0.6); font-size: 0.85rem; margin-bottom: 5px; }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #ffd700;
            background: rgba(255,255,255,0.08);
        }
        .form-group input::placeholder { color: rgba(255,255,255,0.3); }
        
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ffd700, #ff6b00);
            border: none;
            border-radius: 12px;
            color: #000;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary:hover { transform: scale(1.02); box-shadow: 0 5px 25px rgba(255,215,0,0.3); }
        
        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 25px 0 20px;
            color: rgba(255,255,255,0.2);
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.08);
        }
        
        /* ===== أزرار الدفع ===== */
        .pay-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 10px;
        }
        .pay-btn:hover { transform: scale(1.02); }
        .pay-btn.paypal { background: #0070ba; color: #fff; }
        .pay-btn.stripe { background: #635bff; color: #fff; }
        .pay-btn.crypto { background: #f7931a; color: #fff; }
        
        .payment-note {
            text-align: center;
            color: rgba(255,255,255,0.4);
            font-size: 0.75rem;
            margin-top: 10px;
        }
        .payment-note i { color: #ffd700; }
        
        .auth-footer {
            text-align: center;
            margin-top: 20px;
            color: rgba(255,255,255,0.4);
            font-size: 0.9rem;
        }
        .auth-footer a { color: #ffd700; text-decoration: none; }
        .auth-footer a:hover { text-decoration: underline; }
        
        /* ===== نافذة الدفع المنبثقة ===== */
        .popup {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .popup.active { display: flex; }
        .popup-box {
            background: #1a1a2e;
            padding: 35px;
            border-radius: 24px;
            max-width: 440px;
            width: 92%;
            border: 1px solid rgba(255,255,255,0.08);
            position: relative;
            box-shadow: 0 25px 80px rgba(0,0,0,0.8);
        }
        .popup-close {
            position: absolute;
            top: 12px;
            left: 18px;
            font-size: 24px;
            background: none;
            border: none;
            color: rgba(255,255,255,0.4);
            cursor: pointer;
        }
        .popup-close:hover { color: #fff; }
        .popup h3 {
            color: #ffd700;
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.4rem;
        }
        .popup .price {
            font-size: 1.8rem;
            color: #ffd700;
            font-weight: 800;
        }
        .popup .sub-desc {
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;
            margin: 5px 0 15px;
        }
        .popup .btn-confirm {
            background: #4CAF50;
            color: #fff;
            padding: 14px 30px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .popup .btn-confirm:hover { background: #45a049; transform: scale(1.02); }
        .popup .btn-cancel {
            background: transparent;
            color: rgba(255,255,255,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            transition: all 0.3s;
        }
        .popup .btn-cancel:hover { background: rgba(255,255,255,0.05); }
        
        /* ===== إشعار ===== */
        .toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a2e;
            padding: 14px 28px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            z-index: 99999;
            display: none;
            text-align: center;
            min-width: 200px;
            max-width: 90%;
            font-size: 0.95rem;
        }
        .toast.show { display: block; }
        .toast.success { border-color: #4CAF50; }
        .toast.warning { border-color: #ffd700; }
        .toast.error { border-color: #f44336; }
        
        /* ===== PayPal Container ===== */
        #paypal-button-container {
            margin: 15px 0 5px;
            min-height: 50px;
        }
        
        @media (max-width: 500px) {
            .container { padding: 25px; }
            .popup-box { padding: 25px; }
            .pay-btn { font-size: 0.9rem; padding: 12px; }
        }
    </style>
</head>
<body>

    <!-- ===== نموذج التسجيل ===== -->
    <div class="container">
        <div class="logo">🎯</div>
        <h2>إنشاء حساب جديد</h2>
        <p style="text-align:center;color:rgba(255,255,255,0.3);font-size:0.85rem;margin-bottom:20px;">
            ⚠️ الدفع مطلوب لإتمام التسجيل
        </p>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>👤 الاسم الكامل</label>
                <input type="text" id="fullName" required placeholder="أحمد محمد">
            </div>
            <div class="form-group">
                <label>🏢 اسم الشركة (اختياري)</label>
                <input type="text" id="companyName" placeholder="شركة مليون مربع">
            </div>
            <div class="form-group">
                <label>📧 البريد الإلكتروني</label>
                <input type="email" id="email" required placeholder="example@email.com">
            </div>
            <div class="form-group">
                <label>🔒 كلمة المرور</label>
                <input type="password" id="password" required placeholder="••••••••" minlength="6">
            </div>
            <div class="form-group">
                <label>✅ تأكيد كلمة المرور</label>
                <input type="password" id="confirmPassword" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primary">
                <i class="fas fa-user-plus"></i> إنشاء حساب
            </button>
        </form>

        <div class="divider">أو</div>

        <!-- ===== أزرار الدفع ===== -->
        <p style="text-align:center;color:rgba(255,255,255,0.3);font-size:0.8rem;margin-bottom:12px;">
            💳 سجل وادفع معاً
        </p>
        
        <button class="pay-btn paypal" onclick="openPayment('paypal')">
            <i class="fab fa-paypal" style="font-size:1.4rem;"></i> الدفع عبر PayPal والتسجيل
        </button>
        
        <button class="pay-btn stripe" onclick="openPayment('stripe')">
            <i class="fas fa-credit-card"></i> الدفع عبر Stripe والتسجيل
        </button>
        
        <button class="pay-btn crypto" onclick="openPayment('crypto')">
            <i class="fab fa-bitcoin"></i> الدفع بـ USDT والتسجيل
        </button>

        <p class="payment-note">
            <i class="fas fa-info-circle"></i> سيتم إنشاء حسابك فور إتمام الدفع
        </p>

        <div class="auth-footer">
            لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
        </div>
    </div>

    <!-- ===== نافذة الدفع ===== -->
    <div id="paymentPopup" class="popup">
        <div class="popup-box">
            <button class="popup-close" onclick="closePayment()">&times;</button>
            <h3 id="popupTitle">💳 الدفع عبر PayPal</h3>
            <div style="text-align:center;font-size:3rem;margin:10px 0;" id="popupIcon">
                <i class="fab fa-paypal" style="color:#0070ba;"></i>
            </div>
            <p style="text-align:center;color:rgba(255,255,255,0.6);" id="popupDesc">
                سيتم إنشاء حسابك فور الدفع
            </p>
            <div style="text-align:center;margin:15px 0;">
                <span class="price" id="popupPrice">$5.00 USD</span>
                <p class="sub-desc" id="popupSub">(رسوم التسجيل السنوية)</p>
            </div>
            
            <!-- حاوية PayPal -->
            <div id="paypal-button-container"></div>
            
            <div id="paymentStatus" style="text-align:center;margin:10px 0;font-size:0.9rem;"></div>
            
            <button class="btn-cancel" onclick="closePayment()">إلغاء</button>
        </div>
    </div>

    <!-- ===== إشعار ===== -->
    <div id="toast" class="toast">
        <span id="toastMsg"></span>
    </div>

    <!-- ============================================ -->
    <!-- JavaScript المتكامل -->
    <!-- ============================================ -->
    <script>
        // ============================================
        // البيانات
        // ============================================
        let selectedPaymentMethod = 'paypal';
        let isPaymentComplete = false;
        let userData = {};
        
        // ============================================
        // دوال الإشعارات
        // ============================================
        function showToast(msg, type = 'info') {
            const t = document.getElementById('toast');
            const m = document.getElementById('toastMsg');
            m.textContent = msg;
            t.className = 'toast show ' + type;
            clearTimeout(window.timer);
            window.timer = setTimeout(() => { t.className = 'toast'; }, 4000);
        }
        
        // ============================================
        // دوال نافذة الدفع
        // ============================================
        function openPayment(method) {
            // التحقق من صحة بيانات التسجيل
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (!fullName) {
                showToast('⚠️ يرجى إدخال الاسم الكامل', 'warning');
                document.getElementById('fullName').focus();
                return;
            }
            if (!email || !email.includes('@')) {
                showToast('⚠️ يرجى إدخال بريد إلكتروني صحيح', 'warning');
                document.getElementById('email').focus();
                return;
            }
            if (password.length < 6) {
                showToast('⚠️ كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'warning');
                document.getElementById('password').focus();
                return;
            }
            if (password !== confirmPassword) {
                showToast('⚠️ كلمة المرور وتأكيدها غير متطابقين', 'warning');
                document.getElementById('confirmPassword').focus();
                return;
            }
            
            // حفظ بيانات المستخدم
            userData = {
                fullName: fullName,
                companyName: document.getElementById('companyName').value.trim(),
                email: email,
                password: password
            };
            
            selectedPaymentMethod = method;
            
            // تحديث نافذة الدفع
            const popup = document.getElementById('paymentPopup');
            const title = document.getElementById('popupTitle');
            const icon = document.getElementById('popupIcon');
            const desc = document.getElementById('popupDesc');
            const price = document.getElementById('popupPrice');
            
            const methods = {
                paypal: { 
                    title: '💳 الدفع عبر PayPal', 
                    icon: '<i class="fab fa-paypal" style="color:#0070ba;font-size:3rem;"></i>',
                    desc: 'سيتم إنشاء حسابك فور الدفع عبر PayPal',
                    price: '$5.00 USD'
                },
                stripe: { 
                    title: '💳 الدفع عبر Stripe', 
                    icon: '<i class="fas fa-credit-card" style="color:#635bff;font-size:3rem;"></i>',
                    desc: 'سيتم إنشاء حسابك فور الدفع عبر Stripe',
                    price: '$5.00 USD'
                },
                crypto: { 
                    title: '💳 الدفع بـ USDT', 
                    icon: '<i class="fab fa-bitcoin" style="color:#f7931a;font-size:3rem;"></i>',
                    desc: 'سيتم إنشاء حسابك فور الدفع بـ USDT',
                    price: '5 USDT'
                }
            };
            
            const data = methods[method] || methods.paypal;
            title.textContent = data.title;
            icon.innerHTML = data.icon;
            desc.textContent = data.desc;
            price.textContent = data.price;
            
            // إعادة تعيين حالة الدفع
            isPaymentComplete = false;
            document.getElementById('paymentStatus').innerHTML = '';
            
            // فتح النافذة
            popup.classList.add('active');
            
            // تهيئة PayPal فقط إذا كانت الطريقة PayPal
            if (method === 'paypal') {
                setTimeout(() => {
                    initPayPalButton();
                }, 300);
            } else {
                // لـ Stripe و Crypto، نعرض رسالة بديلة
                const container = document.getElementById('paypal-button-container');
                container.innerHTML = `
                    <div style="text-align:center;padding:15px;background:rgba(255,255,255,0.03);border-radius:12px;border:1px solid rgba(255,255,255,0.05);">
                        <p style="color:rgba(255,255,255,0.6);margin-bottom:10px;">
                            <i class="fas fa-info-circle"></i> 
                            ${method === 'stripe' ? 'سيتم توجيهك إلى Stripe لإتمام الدفع' : 'سيتم توجيهك إلى محفظة USDT لإتمام الدفع'}
                        </p>
                        <button onclick="simulatePayment()" 
                                style="background:${method === 'stripe' ? '#635bff' : '#f7931a'};color:#fff;padding:14px 30px;border:none;border-radius:12px;font-weight:700;cursor:pointer;font-size:1rem;">
                            <i class="fas fa-check"></i> تأكيد الدفع والتسجيل
                        </button>
                    </div>
                `;
            }
        }
        
        function closePayment() {
            document.getElementById('paymentPopup').classList.remove('active');
            // إعادة تعيين
            const container = document.getElementById('paypal-button-container');
            container.innerHTML = '';
            document.getElementById('paymentStatus').innerHTML = '';
            isPaymentComplete = false;
        }
        
        // ============================================
        // PayPal - تهيئة الزر
        // ============================================
        let paypalRendered = false;
        
        function initPayPalButton() {
            const container = document.getElementById('paypal-button-container');
            container.innerHTML = '';
            paypalRendered = false;
            
            if (typeof paypal === 'undefined') {
                container.innerHTML = '<p style="color:rgba(255,255,255,0.4);text-align:center;">⏳ جاري تحميل PayPal...</p>';
                setTimeout(() => initPayPalButton(), 1000);
                return;
            }
            
            if (paypalRendered) return;
            paypalRendered = true;
            
            try {
                paypal.Buttons({
                    style: {
                        layout: 'vertical',
                        color: 'gold',
                        shape: 'rect',
                        label: 'paypal',
                        height: 48,
                        tagline: false
                    },
                    createOrder: function(data, actions) {
                        return actions.order.create({
                            purchase_units: [{
                                amount: {
                                    value: '5.00',
                                    currency_code: 'USD'
                                },
                                description: 'اشتراك مليون مربع - تسجيل جديد',
                                custom_id: 'register_' + Date.now()
                            }],
                            application_context: {
                                shipping_preference: 'NO_SHIPPING',
                                brand_name: 'Million Squares',
                                locale: 'ar_SA'
                            }
                        });
                    },
                    onApprove: function(data, actions) {
                        return actions.order.capture().then(function(details) {
                            document.getElementById('paymentStatus').innerHTML = `
                                <span style="color:#4CAF50;font-weight:700;">
                                    ✅ تم الدفع بنجاح!
                                </span>
                            `;
                            isPaymentComplete = true;
                            completeRegistration(details, 'PayPal');
                        });
                    },
                    onError: function(err) {
                        console.error('PayPal Error:', err);
                        document.getElementById('paymentStatus').innerHTML = `
                            <span style="color:#f44336;font-weight:700;">
                                ❌ حدث خطأ في الدفع
                            </span>
                        `;
                        showToast('⚠️ حدث خطأ في الدفع، يرجى المحاولة مرة أخرى', 'error');
                    },
                    onCancel: function() {
                        showToast('تم إلغاء عملية الدفع', 'warning');
                    }
                }).render(container);
            } catch (e) {
                console.error('PayPal init error:', e);
                container.innerHTML = `
                    <div style="text-align:center;padding:15px;background:rgba(255,255,255,0.03);border-radius:12px;">
                        <p style="color:#f44336;">⚠️ حدث خطأ في تحميل PayPal</p>
                        <button onclick="simulatePayment()" 
                                style="background:#4CAF50;color:#fff;padding:12px 25px;border:none;border-radius:10px;font-weight:700;cursor:pointer;margin-top:10px;">
                            <i class="fas fa-check"></i> تأكيد الدفع (تجريبي)
                        </button>
                    </div>
                `;
            }
        }
        
        // ============================================
        // محاكاة الدفع (لـ Stripe و Crypto)
        // ============================================
        function simulatePayment() {
            document.getElementById('paymentStatus').innerHTML = `
                <span style="color:#ffd700;font-weight:700;">
                    ⏳ جاري معالجة الدفع...
                </span>
            `;
            
            setTimeout(() => {
                document.getElementById('paymentStatus').innerHTML = `
                    <span style="color:#4CAF50;font-weight:700;">
                        ✅ تم الدفع بنجاح!
                    </span>
                `;
                isPaymentComplete = true;
                completeRegistration({ id: 'sim_' + Date.now(), payer: { name: { given_name: userData.fullName } } }, selectedPaymentMethod);
            }, 1500);
        }
        
        // ============================================
        // إتمام التسجيل بعد الدفع
        // ============================================
        function completeRegistration(paymentDetails, method) {
            // عرض إشعار نجاح
            showToast(`✅ تم الدفع بنجاح عبر ${method}! 🎉`, 'success');
            
            // إغلاق نافذة الدفع
            closePayment();
            
            // إنشاء الحساب
            const user = {
                id: Date.now(),
                name: userData.fullName,
                email: userData.email,
                company: userData.companyName,
                password: userData.password,
                paymentMethod: method,
                paymentId: paymentDetails.id || 'sim_' + Date.now(),
                registeredAt: new Date().toISOString(),
                status: 'active'
            };
            
            // حفظ في localStorage (محاكاة قاعدة بيانات)
            let users = JSON.parse(localStorage.getItem('million_squares_users') || '[]');
            users.push(user);
            localStorage.setItem('million_squares_users', JSON.stringify(users));
            
            // حفظ جلسة المستخدم
            localStorage.setItem('million_squares_session', JSON.stringify({
                userId: user.id,
                name: user.name,
                email: user.email,
                loggedIn: true
            }));
            
            // إشعار نجاح التسجيل
            setTimeout(() => {
                showToast('🎉 تم إنشاء حسابك بنجاح! جاري التوجيه...', 'success');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            }, 500);
            
            console.log('✅ مستخدم جديد:', user);
        }
        
        // ============================================
        // معالج نموذج التسجيل (طريقة عادية بدون دفع)
        // ============================================
        function handleRegister(event) {
            event.preventDefault();
            
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (!fullName) {
                showToast('⚠️ يرجى إدخال الاسم الكامل', 'warning');
                document.getElementById('fullName').focus();
                return;
            }
            if (!email || !email.includes('@')) {
                showToast('⚠️ يرجى إدخال بريد إلكتروني صحيح', 'warning');
                document.getElementById('email').focus();
                return;
            }
            if (password.length < 6) {
                showToast('⚠️ كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'warning');
                document.getElementById('password').focus();
                return;
            }
            if (password !== confirmPassword) {
                showToast('⚠️ كلمة المرور وتأكيدها غير متطابقين', 'warning');
                document.getElementById('confirmPassword').focus();
                return;
            }
            
            // عرض رسالة بأن الدفع مطلوب
            showToast('⚠️ الدفع مطلوب لإتمام التسجيل. استخدم إحدى طرق الدفع أعلاه.', 'warning');
            
            // فتح نافذة الدفع تلقائياً
            setTimeout(() => {
                openPayment('paypal');
            }, 500);
        }
        
        // ============================================
