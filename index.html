<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 مليون مربع - المنصة البصرية التفاعلية</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            font-family: 'Tajawal', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .square-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        
        .square-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }
        
        .tier-basic { background: linear-gradient(135deg, #f5f5f5, #e0e0e0); }
        .tier-silver { background: linear-gradient(135deg, #e8e8e8, #c0c0c0); }
        .tier-gold { background: linear-gradient(135deg, #ffd700, #ffb300); }
        .tier-platinum { background: linear-gradient(135deg, #e5e4e2, #b8b8b8); }
        
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        
        .status-available { background: #10b981; color: white; }
        .status-sold { background: #ef4444; color: white; }
        .status-reserved { background: #f59e0b; color: white; }
        .status-pending { background: #8b5cf6; color: white; }
        
        .filter-section {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        
        .animate-pulse-slow {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .loading-spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top: 4px solid #667eea;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .view-toggle {
            transition: all 0.3s ease;
        }
        
        .view-toggle.active {
            background: #667eea;
            color: white;
        }
        
        /* تنسيق المربعات في وضع القائمة */
        .list-view .square-card {
            display: flex;
            flex-direction: row;
            align-items: center;
            padding: 16px;
        }
        
        .list-view .square-icon {
            width: 80px;
            height: 80px;
            min-width: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            border-radius: 12px;
            margin-left: 16px;
        }
        
        .list-view .square-content {
            flex: 1;
        }
        
        .list-view .square-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        @media (max-width: 768px) {
            .list-view .square-card {
                flex-direction: column;
                align-items: stretch;
            }
            
            .list-view .square-icon {
                width: 100%;
                height: 120px;
                margin-left: 0;
                margin-bottom: 12px;
            }
        }
        
        /* تنسيق التقييم بالنجوم */
        .stars {
            color: #fbbf24;
            letter-spacing: 2px;
        }
        
        .stars .empty {
            color: #d1d5db;
        }
    </style>
</head>
<body>
    <div class="container mx-auto px-4 py-8 max-w-7xl">
        
        <!-- الهيدر -->
        <header class="glass-effect p-6 mb-8">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">

                    </div>
                    <div>

            </div>
            
            <!-- إحصائيات سريعة -->
            <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mt-6 pt-6 border-t border-gray-200">
                <div class="text-center">
                    <div class="text-2xl font-bold text-blue-600" id="totalSquares">1,000,000</div>
                    <div class="text-sm text-gray-600">📦 إجمالي المربعات</div>
                </div>
                <div class="text-center">
                    <div class="text-2xl font-bold text-green-600" id="soldSquares">12</div>
                    <div class="text-sm text-gray-600">✅ مباع</div>
                </div>
                <div class="text-center">
                    <div class="text-2xl font-bold text-purple-600" id="subscribers">12</div>
                    <div class="text-sm text-gray-600">👥 مشتركين</div>
                </div>
                <div class="text-center">
                    <div class="text-2xl font-bold text-yellow-600" id="revenue">$122</div>

                </div>
                <div class="text-center">

                    <div class="text-sm text-gray-600">🌟 داعمين</div>
                </div>
            </div>
        </header>
        
        <!-- الفلاتر المتقدمة -->
        <div id="filtersSection" class="filter-section hidden">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">🏷️ الفئة</label>
                    <select id="tierFilter" class="w-full px-3 py-2 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-blue-500">
                        <option value="all">جميع الفئات</option>
                        <option value="basic">💎 عادي</option>
                        <option value="silver">⭐ فضي</option>
                        <option value="gold">👑 ذهبي</option>
                        <option value="platinum">💠 ملكي</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">📂 المجال</label>
                    <select id="categoryFilter" class="w-full px-3 py-2 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-blue-500">
                        <option value="all">جميع المجالات</option>
                        <option value="marketing">تسويق</option>
                        <option value="programming">برمجة</option>
                        <option value="design">تصميم</option>

                        <option value="gaming">ألعاب</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">📍 الحالة</label>
                    <select id="statusFilter" class="w-full px-3 py-2 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-blue-500">
                        <option value="all">جميع الحالات</option>
                        <option value="available">🟢 متاح</option>
                        <option value="sold">🔴 مباع</option>
                        <option value="reserved">🟡 محجوز</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">💰 نطاق السعر</label>
                    <div class="flex gap-2">
                        <input type="number" id="minPrice" placeholder="من" class="w-1/2 px-3 py-2 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-blue-500">
                        <input type="number" id="maxPrice" placeholder="إلى" class="w-1/2 px-3 py-2 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-blue-500">
                    </div>
                </div>
            </div>
            
            <div class="flex justify-end mt-4">
                <button onclick="resetFilters()" class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition flex items-center gap-2">
                    <i class="fas fa-undo"></i>
                    إعادة تعيين
                </button>
            </div>
        </div>
        
        <!-- شريط التحكم -->
        <div class="flex flex-wrap justify-between items-center mb-6 bg-white rounded-xl p-4 shadow">
            <div class="flex items-center gap-4">
                <span class="text-gray-600" id="resultsCount">عرض 12 من 512 مربع</span>
                <div class="flex gap-2">
                    <button onclick="setView('grid')" id="gridViewBtn" class="p-2 rounded-lg bg-blue-100 text-blue-600 view-toggle active">
                        <i class="fas fa-th"></i>
                    </button>
                    <button onclick="setView('list')" id="listViewBtn" class="p-2 rounded-lg text-gray-400 view-toggle">
                        <i class="fas fa-list"></i>
                    </button>
                </div>
            </div>
            
            <div class="flex items-center gap-4 mt-2 md:mt-0">
                <label class="text-sm text-gray-600">ترتيب حسب:</label>
                <select id="sortSelect" class="px-3 py-1 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-blue-500">
                    <option value="newest">الأحدث</option>
                    <option value="price-low">السعر: من الأقل</option>
                    <option value="price-high">السعر: من الأعلى</option>
                    <option value="popular">الأكثر مشاهدة</option>
                    <option value="rated">الأعلى تقييمًا</option>
                </select>
            </div>
        </div>
        
        <!-- عرض المربعات -->
        <div id="squaresContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- سيتم ملء هذا القسم بواسطة JavaScript -->
        </div>
        
        <!-- الترقيم -->
        <div id="pagination" class="flex justify-center gap-2 mt-8">
            <!-- سيتم ملء هذا القسم بواسطة JavaScript -->
        </div>
        
        <!-- الفوتر -->
        <footer class="mt-12 text-center text-white/80 text-sm">
            <p>© 2026 مليون مربع - المنصة البصرية التفاعلية الأولى في العالم العربي</p>
            <p class="mt-2 opacity-60">✨ تم تطويره باستخدام ❤️ في العالم العربي</p>
        </footer>
    </div>

    <script>
        // ============================================
        // البيانات الوهمية (يمكن استبدالها ببيانات من API)
        // ============================================
        const sampleSquares = [
            {
                id: 1,
                number: 1,
                tier: 'platinum',
                status: 'sold',
                price: 100,
                category: 'marketing',
                owner: { name: 'هند القحطاني' },
                location: { city: 'المنامة', country: 'قطر' },
                content: { title: 'تسويق رقمي متقدم', description: 'خدمات تسويق رقمي متكاملة للشركات' },
                stats: { views: 1500, clicks: 89 },
                rating: { average: 4.8, count: 23 }
            },
            {
                id: 2,
                number: 2,
                tier: 'gold',
                status: 'available',
                price: 10,
                category: 'programming',
                owner: { name: 'نورة الحربي' },
                location: { city: 'المدينة', country: 'الكويت' },
                content: { title: 'برمجة تطبيقات', description: 'تطوير تطبيقات ويب وموبايل احترافية' },
                stats: { views: 890, clicks: 45 },
                rating: { average: 4.5, count: 12 }
            },
            {
                id: 3,
                number: 3,
                tier: 'gold',
                status: 'sold',
                price: 10,
                category: 'design',
                owner: { name: 'منى السبيعي' },
                location: { city: 'الدوحة', country: 'السعودية' },
                content: { title: 'تصميم جرافيك احترافي', description: 'تصميم هويات ومواد تسويقية' },
                stats: { views: 2100, clicks: 156 },
                rating: { average: 4.9, count: 34 }
            },
            {
                id: 4,
                number: 4,
                tier: 'silver',
                status: 'available',
                price: 5,
                category: 'marketing',
                owner: { name: 'محمد العمري' },
                location: { city: 'جدة', country: 'الإمارات' },
                content: { title: 'تسويق عبر التواصل', description: 'استراتيجيات تسويق فعالة' },
                stats: { views: 450, clicks: 23 },
                rating: { average: 4.2, count: 8 }
            },
            {
                id: 5,
                number: 5,
                tier: 'platinum',
                status: 'reserved',
                price: 100,
                category: 'programming',
                owner: { name: 'لمى الشهراني' },
                location: { city: 'جدة', country: 'البحرين' },
                content: { title: 'برمجة متقدمة', description: 'حلول برمجية مبتكرة للشركات' },
                stats: { views: 3200, clicks: 201 },
                rating: { average: 4.7, count: 28 }
            },
            {
                id: 6,
                number: 6,
                tier: 'gold',
                status: 'available',
                price: 10,
                category: 'design',
                owner: { name: 'فهد العتيبي' },
                location: { city: 'الرياض', country: 'الكويت' },
                content: { title: 'تصميم واجهات', description: 'تصميم واجهات مستخدم جذابة' },
                stats: { views: 670, clicks: 34 },
                rating: { average: 4.3, count: 15 }
            },
            {
                id: 7,
                number: 7,
                tier: 'silver',
                status: 'sold',
                price: 5,
                category: 'ai',
                owner: { name: 'فاطمة الزهراء' },
                location: { city: 'دبي', country: 'عُمان' },
                content: { title: 'ذكاء اصطناعي', description: 'حلول ذكاء اصطناعي للأعمال' },
                stats: { views: 1850, clicks: 112 },
                rating: { average: 4.6, count: 19 }
            },
            {
                id: 8,
                number: 8,
                tier: 'basic',
                status: 'available',
                price: 1,
                category: 'data',
                owner: { name: 'علي الشمري' },
                location: { city: 'الدمام', country: 'البحرين' },
                content: { title: 'تحليل بيانات', description: 'تحليل وتصور البيانات' },
                stats: { views: 320, clicks: 15 },
                rating: { average: 4.0, count: 6 }
            },
            {
                id: 9,
                number: 9,
                tier: 'basic',
                status: 'available',
                price: 1,
                category: 'webdev',
                owner: { name: 'سعود الحربي' },
                location: { city: 'الكويت', country: 'الإمارات' },
                content: { title: 'تطوير ويب', description: 'تطوير مواقع ويب متكاملة' },
                stats: { views: 560, clicks: 28 },
                rating: { average: 4.1, count: 9 }
            },
            {
                id: 10,
                number: 10,
                tier: 'gold',
                status: 'sold',
                price: 10,
                category: 'design',
                owner: { name: 'سارة الخالدي' },
                location: { city: 'مكة', country: 'قطر' },
                content: { title: 'تصميم جرافيك متقدم', description: 'تصاميم احترافية للعلامات التجارية' },
                stats: { views: 1400, clicks: 78 },
                rating: { average: 4.4, count: 17 }
            },
            {
                id: 11,
                number: 11,
                tier: 'gold',
                status: 'available',
                price: 10,
                category: 'cybersecurity',
                owner: { name: 'خالد المالكي' },
                location: { city: 'أبها', country: 'الأردن' },
                content: { title: 'أمن سيبراني', description: 'استشارات وحلول أمنية متكاملة' },
                stats: { views: 980, clicks: 52 },
                rating: { average: 4.7, count: 21 }
            },
            {
                id: 12,
                number: 12,
                tier: 'basic',
                status: 'sold',
                price: 1,
                category: 'webdev',
                owner: { name: 'أحمد محمد' },
                location: { city: 'الرياض', country: 'السعودية' },
                content: { title: 'تطوير تطبيقات', description: 'تطوير تطبيقات ويب متقدمة' },
                stats: { views: 750, clicks: 41 },
                rating: { average: 4.3, count: 14 }
            }
        ];

        // ============================================
        // دوال المنصة الرئيسية
        // ============================================
        let currentView = 'grid';
        let currentPage = 1;
        const itemsPerPage = 8;
        let filteredSquares = [...sampleSquares];

        // عرض المربعات
        function renderSquares() {
            const container = document.getElementById('squaresContainer');
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageItems = filteredSquares.slice(start, end);
            
            if (pageItems.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12">
                        <div class="text-6xl mb-4">🔍</div>
                        <h3 class="text-2xl font-semibold text-gray-600 mb-2">لا توجد مربعات</h3>
                        <p class="text-gray-500">جرب تغيير معايير البحث أو الفلترة</p>
                    </div>
                `;
                document.getElementById('pagination').innerHTML = '';
                document.getElementById('resultsCount').textContent = `0 نتائج`;
                return;
            }

            const isListView = currentView === 'list';
            container.className = isListView ? 'grid grid-cols-1 gap-4' : 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6';

            container.innerHTML = pageItems.map(square => {
                const tierEmojis = { basic: '💎', silver: '⭐', gold: '👑', platinum: '💠' };
                const tierColors = {
                    basic: 'tier-basic',
                    silver: 'tier-silver',
                    gold: 'tier-gold',
                    platinum: 'tier-platinum'
                };
                const statusClass = `status-${square.status}`;
                const stars = '★'.repeat(Math.round(square.rating.average)) + '☆'.repeat(5 - Math.round(square.rating.average));

                return `
                    <div class="square-card glass-effect p-4 ${isListView ? 'flex items-center gap-4' : ''}">
                        <div class="${isListView ? 'w-20 h-20 min-w-20' : 'w-full h-32'} ${tierColors[square.tier]} rounded-xl flex items-center justify-center text-4xl">
                            ${tierEmojis[square.tier]}
                        </div>
                        <div class="${isListView ? 'flex-1' : 'mt-3'}">
                            <div class="flex justify-between items-start">
                                <h3 class="font-bold text-lg">${square.content.title}</h3>
                                <span class="status-badge ${statusClass}">${square.status === 'available' ? '🟢 متاح' : square.status === 'sold' ? '🔴 مباع' : '🟡 محجوز'}</span>
                            </div>
                            <div class="flex items-center gap-2 text-sm text-gray-600 mt-1">
                                <i class="fas fa-user text-blue-500"></i>
                                <span>${square.owner.name}</span>
                            </div>
                            <div class="flex items-center gap-2 text-sm text-gray-600">
                                <i class="fas fa-map-marker-alt text-red-400"></i>
                                <span>${square.location.city}, ${square.location.country}</span>
                            </div>
                            <div class="flex items-center gap-2 text-sm text-gray-600">
                                <i class="fas fa-tag text-purple-400"></i>
                                <span>${square.category}</span>
                            </div>
                            ${!isListView ? `
                                <div class="flex items-center gap-2 text-sm text-gray-500 mt-1">
                                    <span class="stars">${stars}</span>
                                    <span>(${square.rating.count})</span>
                                </div>
                            ` : ''}
                            <div class="flex justify-between items-center mt-2 pt-2 border-t border-gray-100">
                                <div class="flex items-center gap-3 text-sm text-gray-500">
                                    <span><i class="far fa-eye"></i> ${square.stats.views}</span>
                                    <span><i class="far fa-star text-yellow-500"></i> ${square.rating.average}</span>
                                </div>
                                <div class="font-bold text-blue-600">$${square.price}/سنة</div>
                            </div>
                            ${isListView ? `
                                <div class="flex items-center gap-2 text-sm text-gray-500 mt-2">
                                    <span class="stars">${stars}</span>
                                    <span>(${square.rating.count})</span>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');

            // تحديث عداد النتائج
            document.getElementById('resultsCount').textContent = `عرض ${pageItems.length} من ${filteredSquares.length} مربع`;
            
            // تحديث الترقيم
            renderPagination();
        }

        // عرض الترقيم
        function renderPagination() {
            const totalPages = Math.ceil(filteredSquares.length / itemsPerPage);
            const pagination = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let html = '';
            for (let i = 1; i <= totalPages; i++) {
                html += `
                    <button onclick="goToPage(${i})" 
                            class="px-4 py-2 rounded-lg transition ${i === currentPage ? 'bg-blue-600 text-white' : 'bg-white text-gray-600 hover:bg-blue-50'}">
                        ${i}
                    </button>
                `;
            }
            pagination.innerHTML = html;
        }

        // الانتقال لصفحة معينة
        function goToPage(page) {
            currentPage = page;
            renderSquares();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // فلترة المربعات
        function filterSquares() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const tier = document.getElementById('tierFilter').value;
            const category = document.getElementById('categoryFilter').value;
            const status = document.getElementById('statusFilter').value;
            const minPrice = parseFloat(document.getElementById('minPrice').value) || 0;
            const maxPrice = parseFloat(document.getElementById('maxPrice').value) || Infinity;
            const sort = document.getElementById('sortSelect').value;

            filteredSquares = sampleSquares.filter(square => {
                const matchesSearch = square.content.title.toLowerCase().includes(search) ||
                                    square.content.description.toLowerCase().includes(search) ||
                                    square.owner.name.toLowerCase().includes(search);
                const matchesTier = tier === 'all' || square.tier === tier;
                const matchesCategory = category === 'all' || square.category === category;
                const matchesStatus = status === 'all' || square.status === status;
                const matchesPrice = square.price >= minPrice && square.price <= maxPrice;
                
                return matchesSearch && matchesTier && matchesCategory && matchesStatus && matchesPrice;
            });

            // ترتيب النتائج
            switch(sort) {
                case 'newest':
                    filteredSquares.sort((a, b) => b.id - a.id);
                    break;
                case 'price-low':
                    filteredSquares.sort((a, b) => a.price - b.price);
                    break;
                case 'price-high':
                    filteredSquares.sort((a, b) => b.price - a.price);
                    break;
                case 'popular':
                    filteredSquares.sort((a, b) => b.stats.views - a.stats.views);
                    break;
                case 'rated':
                    filteredSquares.sort((a, b) => b.rating.average - a.rating.average);
                    break;
            }

            currentPage = 1;
            renderSquares();
        }

        // إعادة تعيين الفلاتر
        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('tierFilter').value = 'all';
            document.getElementById('categoryFilter').value = 'all';
            document.getElementById('statusFilter').value = 'all';
            document.getElementById('minPrice').value = '';
            document.getElementById('maxPrice').value = '';
            document.getElementById('sortSelect').value = 'newest';
            filterSquares();
        }

        // تبديل عرض الفلاتر
        function toggleFilters() {
            const section = document.getElementById('filtersSection');
            section.classList.toggle('hidden');
        }

        // تغيير طريقة العرض
        function setView(view) {
            currentView = view;
            document.getElementById('gridViewBtn').className = view === 'grid' ? 'p-2 rounded-lg bg-blue-100 text-blue-600 view-toggle active' : 'p-2 rounded-lg text-gray-400 view-toggle';
            document.getElementById('listViewBtn').className = view === 'list' ? 'p-2 rounded-lg bg-blue-100 text-blue-600 view-toggle active' : 'p-2 rounded-lg text-gray-400 view-toggle';
            renderSquares();
        }

        // ============================================
        // تهيئة المنصة
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            // تحديث الإحصائيات
            document.getElementById('soldSquares').textContent = sampleSquares.filter(s => s.status === 'sold').length;
            document.getElementById('subscribers').textContent = sampleSquares.length;
            document.getElementById('revenue').textContent = '$' + sampleSquares.reduce((sum, s) => sum + s.price, 0);
            document.getElementById('supporters').textContent = sampleSquares.filter(s => s.tier === 'platinum').length;

            // عرض المربعات
            filterSquares();

            // ربط الأحداث
            document.getElementById('searchInput').addEventListener('input', filterSquares);
            document.getElementById('tierFilter').addEventListener('change', filterSquares);
            document.getElementById('categoryFilter').addEventListener('change', filterSquares);
            document.getElementById('statusFilter').addEventListener('change', filterSquares);
            document.getElementById('minPrice').addEventListener('input', filterSquares);
            document.getElementById('maxPrice').addEventListener('input', filterSquares);
            document.getElementById('sortSelect').addEventListener('change', filterSquares);
        });

        // ============================================
        // دوال إضافية (مثل التواصل مع API)
        // ============================================
        async function fetchSquaresFromAPI() {
            try {
                const response = await fetch('/api/squares');
                const data = await response.json();
                // دمج البيانات مع العينة (في حالة عدم وجود بيانات من API)
                if (data.squares && data.squares.length > 0) {
                    // استبدال العينة بالبيانات الحقيقية
                    // sampleSquares = data.squares;
                    filterSquares();
                }
            } catch (error) {
                console.log('استخدام البيانات الوهمية بسبب خطأ في الاتصال:', error);
            }
        }

        // يمكن استدعاء هذه الدالة لجلب البيانات من API
        // fetchSquaresFromAPI();

        console.log('🏆 مليون مربع - المنصة البصرية التفاعلية');
        console.log('✨ تم تحميل الموقع بنجاح مع جميع الميزات المحسنة');
    </script>
